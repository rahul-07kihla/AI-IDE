version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_ide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ai-ide/api dev"
    env_file:
      - ../../.env
    ports:
      - "4000:4000"
    volumes:
      - ../../:/workspace
    depends_on:
      - postgres
      - redis

  web:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ai-ide/web dev"
    env_file:
      - ../../.env
    ports:
      - "3000:3000"
    volumes:
      - ../../:/workspace
    depends_on:
      - api

  sandbox-worker:
    image: node:20-bookworm
    working_dir: /workspace
    command: sh -c "node apps/sandbox-worker/src/main.js"
    env_file:
      - ../../.env
    ports:
      - "4100:4100"
    volumes:
      - ../../:/workspace

volumes:
  postgres_data:

